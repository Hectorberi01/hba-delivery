name: hba_core
description: Acces HTTP et session, communs aux applications HBA.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  # DECLARE, ALORS QU'IL L'ETAIT DEJA EN FAIT. Ce paquet depend de
  # flutter_secure_storage, qui est un greffon Flutter : Flutter etait donc une
  # dependance reelle, non ecrite, empruntee a l'application qui consomme le
  # paquet. La declarer est ce qui permet a « flutter test » de tourner ici.
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1

  # LE TEMPS REEL, ET IL EST ICI PLUTOT QUE DANS CHAQUE APPLICATION.
  #
  # Les deux applications s'abonnent a des hubs differents — le client suit une
  # mission, le livreur attend une offre — mais la PLOMBERIE est la meme :
  # negocier, porter le jeton dans la chaine de requete, se reconnecter quand le
  # reseau revient, abandonner proprement a la deconnexion. Chacune l'ecrirait
  # autrement, et c'est exactement ce que dit deja le commentaire des paquets
  # d'image dans les deux pubspec : deux facons de faire la meme chose finissent
  # par differer la ou personne ne regarde.
  #
  # LE JETON PASSE PAR LA CHAINE DE REQUETE, pas par un en-tete : un WebSocket
  # ne permet pas d'en poser a l'ouverture. C'est la convention de SignalR, et le
  # service Realtime ne l'accepte que sur les chemins des hubs — voir le
  # commentaire de son Program.cs.
  signalr_netcore: ^1.3.7

dev_dependencies:
  # hba_core n'avait AUCUN test, et c'est le paquet qui porte la session, le
  # rafraichissement et la file : le defaut B6 de l'audit du 30/09/2026 vivait
  # ici, dans du code que rien n'exercait.
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
