name: hba_client
description: Application client HBA Delivery.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  hba_ui:
    path: ../hba_ui
  hba_core:
    path: ../hba_core
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # DECLARE, ALORS QU'IL L'ETAIT DEJA EN FAIT — et c'est le meme constat que celui
  # ecrit dans le pubspec de hba_core a propos de Flutter.
  #
  # « lien_maps.dart » importe dio directement : il lui faut « BaseOptions », que
  # hba_core ne reexporte pas (il n'ouvre que Dio, FormData et MultipartFile). Cette
  # application compilait donc grace a une dependance TRANSITIVE, empruntee a
  # hba_core sans etre ecrite — exactement ce que signale « flutter analyze » depuis
  # le debut.
  #
  # LE JOUR OU hba_core CHANGERAIT DE CLIENT HTTP, client_app aurait cesse de
  # compiler pour une raison sans lien visible avec le changement. La version suit
  # celle de hba_core, a dessein : deux versions de dio dans le meme arbre
  # resoudraient vers une seule, choisie par le gestionnaire et non par nous.
  dio: ^5.7.0

  # DECLARE POUR LA MEME RAISON QUE dio JUSTE AU-DESSUS, et la lecon vient du meme
  # endroit : « lib/core/paiement_en_attente.dart » importe directement
  # FlutterSecureStorage, que hba_core ne reexporte pas. Compiler grace a une
  # dependance transitive, c'est cesser de compiler le jour ou hba_core change de
  # stockage, pour une raison sans lien visible avec le changement.
  #
  # LA VERSION SUIT CELLE DE hba_core, a dessein : deux versions du meme paquet
  # dans l'arbre resoudraient vers une seule, choisie par le gestionnaire.
  flutter_secure_storage: ^9.2.2

  google_maps_flutter: ^2.18.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.1

  # LA PAGE DE PAIEMENT VIT DANS L'APPLICATION, PAS DANS LE NAVIGATEUR.
  # url_launcher reste indispensable : la vue integree lui confie tout ce qui
  # n'est pas http(s) — un code USSD, le schema propre d'un operateur mobile
  # money — au lieu d'essayer de l'afficher, ce qui donnerait une page blanche
  # au milieu d'un paiement.
  webview_flutter: ^4.10.0

  # PHOTO DE PROFIL. Memes paquets et memes versions que l'application livreur,
  # qui les utilise depuis les pieces du dossier : deux applications du meme
  # depot qui reduisent une image de deux facons differentes finiraient par
  # envoyer deux poids differents au meme plafond de cinq megaoctets.
  image_picker: ^1.1.2

  # COMPRESSION DE L'IMAGE CADREE. L'ecran de cadrage redessine la portion
  # choisie et la rend en PNG — un a deux megaoctets pour mille pixels de
  # cote ; ce paquet la ramene a cent cinquante kilooctets en JPEG. Le client
  # paie ses donnees a la recharge.
  #
  # LA COMPRESSION NATIVE, et pas la meme chose en Dart pur, qui gelerait
  # l'ecran une seconde ou deux.
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # LES DEUX METIERS, EN IMAGE. Un dossier et non deux lignes : la liste
  # grandira avec les services, et declarer chaque fichier a la main finit
  # toujours par en oublier un — qui ne manque qu'a l'execution, sur l'appareil.
  assets:
    - assets/services/
