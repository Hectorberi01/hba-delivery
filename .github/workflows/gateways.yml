name: gateways

on:
  push:
    branches: [main]
    paths:
      - 'src/Gateways/**'
      - 'contracts/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/gateways.yml'
  pull_request:
    paths:
      - 'src/Gateways/**'
      - 'contracts/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/gateways.yml'

concurrency:
  group: gateways-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gateway:
          - Hba.Bff.Client
          - Hba.Bff.Driver
          - Hba.Bff.Web
          - Hba.PartnerApi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compiler
        run: >
          dotnet build src/Gateways/${{ matrix.gateway }}/${{ matrix.gateway }}.csproj
          --configuration Release

      - name: Construire l'image
        run: >
          docker build -f src/Gateways/${{ matrix.gateway }}/Dockerfile
          -t hba/${{ matrix.gateway }}:${{ github.sha }} .
