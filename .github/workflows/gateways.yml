name: gateways

on:
  push:
    branches: [main]
    paths:
      - 'src/Gateways/**'
      - 'contracts/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/gateways.yml'
  pull_request:
    paths:
      - 'src/Gateways/**'
      - 'contracts/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/gateways.yml'

concurrency:
  group: gateways-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compiler
        run: >
          dotnet build src/Gateways/Hba.Gateway/Hba.Gateway.csproj
          --configuration Release

      - name: Construire l'image
        run: >
          docker build -f src/Gateways/Hba.Gateway/Dockerfile
          -t hba/gateway:${{ github.sha }} .
