syntax = "proto3";

package hba.identity.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Hba.Contracts.Identity.V1";

// Identity émet les jetons et expose les JWKS. Les rôles sont exactement ceux du
// référentiel acteurs : customer, driver, merchant_owner, merchant_staff,
// partner, admin, ops, support, finance. Aucun autre nom n'est accepté.
//
// Les JWKS et le document de découverte ne sont PAS ici : ce sont des points
// d'entrée HTTP, consommés par le middleware JwtBearer de chaque service.
//   GET /.well-known/openid-configuration
//   GET /.well-known/jwks.json
service IdentityService {
  // --- Téléphone + OTP : clients et livreurs ---
  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (TokenPair);

  // --- Mot de passe : portail commerçant et back-office ---
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (TokenPair);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);

  // --- Cycle de vie des jetons ---
  // Le jeton de rafraîchissement est à usage unique : l'utiliser le révoque et
  // en émet un nouveau. Un jeton déjà consommé qui revient signale un vol et
  // révoque toute la chaîne.
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeTokenResponse);

  // --- Comptes ---
  rpc GetPrincipal(GetPrincipalRequest) returns (Principal);

  // --- Consentement WhatsApp, par le titulaire du compte ---
  //
  // IDENTITY LE DETIENT PARCE QU'IL DETIENT LE TELEPHONE. C'est lui qui envoie
  // le code de connexion, et « CanReceiveWhatsApp » decide deja du canal :
  // mettre le consentement ailleurs obligerait a le rapatrier a chaque envoi.
  //
  // AUCUN IDENTIFIANT DANS LES DEUX REQUETES : le compte vise est le sujet du
  // jeton. Un client ne consent pas a la place d'un autre.
  rpc GetWhatsAppConsent(GetWhatsAppConsentRequest) returns (WhatsAppConsent);
  rpc SetWhatsAppConsent(SetWhatsAppConsentRequest) returns (WhatsAppConsent);
  rpc CreateBackOfficeAccount(CreateBackOfficeAccountRequest) returns (Account);
  rpc CreateMerchantAccount(CreateMerchantAccountRequest) returns (Account);
  rpc SetAccountRoles(SetAccountRolesRequest) returns (Account);
  rpc SuspendAccount(SuspendAccountRequest) returns (Account);
  rpc ReactivateAccount(ReactivateAccountRequest) returns (Account);

  // --- Suppression du compte, a la demande de son titulaire ---
  //
  // TROIS APPELS, PARCE QUE LA SUPPRESSION EST UNE FENETRE ET NON UN INSTANT.
  // Le titulaire demande ; le compte entre en PENDING_DELETION et ses sessions
  // sont revoquees ; trente jours plus tard un travail planifie efface la ligne
  // pour de bon et publie AccountErased. Se reconnecter pendant la fenetre
  // permet d'annuler.
  //
  // POURQUOI UN DELAI PLUTOT QU'UN EFFACEMENT IMMEDIAT. Un telephone reste
  // deverrouille, un appui malheureux, et l'historique d'un client part sans
  // retour possible — le support ne peut alors rien pour lui, puisqu'il ne
  // reste rien a restaurer. Trente jours coutent un etat de plus et un
  // ordonnanceur ; l'effacement immediat coute des clients.
  //
  // AUCUN IDENTIFIANT DANS LES REQUETES : on ne supprime que son propre compte.
  // Le back-office qui aurait a le faire pour quelqu'un passera par une autre
  // porte, le jour ou elle existera — lui en donner une ici ferait d'un geste
  // du titulaire un geste d'administration.
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (AccountDeletion);
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (AccountDeletion);
  rpc GetAccountDeletion(GetAccountDeletionRequest) returns (AccountDeletion);

  // --- Partenaires B2B (OAuth2 client credentials) ---
  rpc CreatePartnerClient(CreatePartnerClientRequest) returns (PartnerClientCreated);
  rpc IssuePartnerToken(IssuePartnerTokenRequest) returns (TokenPair);
  rpc RotatePartnerSecret(RotatePartnerSecretRequest) returns (PartnerClientCreated);
  // Appel interne : la Partner API a besoin de l'URL et du secret de signature
  // pour émettre un webhook. Réservé aux appelants du back-office.
  rpc GetPartnerWebhookConfig(GetPartnerWebhookConfigRequest) returns (PartnerWebhookConfig);

  // --- Services internes (OAuth2 client credentials) ---
  // Un service qui appelle un autre service DOIT porter un jeton : l'ADR 0007
  // exige que l'autorisation soit verifiee par le service appele, et un appel
  // parti d'un consommateur Kafka ou d'un planificateur n'a aucun utilisateur
  // dont reporter le jeton.
  //
  // Appel non authentifie, comme IssuePartnerToken : le secret client EST
  // l'authentification. Le jeton emis ne porte AUCUN role du referentiel — un
  // service n'est pas un acteur, et ne doit jamais pouvoir se faire passer
  // pour un client, un livreur ou un administrateur.
  rpc IssueServiceToken(IssueServiceTokenRequest) returns (ServiceToken);
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_SUSPENDED = 2;

  // Le titulaire a demande la suppression ; la ligne existe encore, le temps
  // du delai de grace. ELLE N'EST PAS UNE SUSPENSION : un compte suspendu ne
  // se connecte plus, celui-ci le doit — c'est en se reconnectant qu'on annule.
  ACCOUNT_STATUS_PENDING_DELETION = 3;
}

// L'etat de la demande de suppression, tel que le titulaire a le droit de le
// voir.
//
// « requested » FAUX N'EST PAS UNE ABSENCE DE REPONSE. L'application doit
// pouvoir distinguer « vous n'avez rien demande » de « nous n'avons pas pu
// verifier » : sans ce booleen, une date vide dirait les deux a la fois.
message AccountDeletion {
  bool requested = 1;
  google.protobuf.Timestamp requested_at = 2;
  // Le jour ou l'effacement aura lieu si rien ne l'annule.
  google.protobuf.Timestamp scheduled_for = 3;
}

message RequestAccountDeletionRequest {
}

message CancelAccountDeletionRequest {
}

message GetAccountDeletionRequest {
}

// À quoi sert l'OTP demandé. Détermine le rôle du compte créé si le numéro est
// inconnu — et seuls customer et driver peuvent naître d'un OTP.
enum OtpIntent {
  OTP_INTENT_UNSPECIFIED = 0;
  OTP_INTENT_CUSTOMER = 1;
  OTP_INTENT_DRIVER = 2;
}

message RequestOtpRequest {
  // Format E.164, +229…
  string phone = 1;
  OtpIntent intent = 2;
  // Identifiant d'appareil, pour lier la session émise.
  string device_id = 3;
}

// La réponse est IDENTIQUE quel que soit l'état du numéro : inconnu, client,
// livreur, commerçant, suspendu. Elle ne dit donc rien à qui essaie de savoir
// si un numéro a un compte chez HBA.
message RequestOtpResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  // Délai avant de pouvoir redemander un code pour ce numéro.
  int32 retry_after_seconds = 3;

  // 4 portait is_new_account : retiré, il transformait l'API en annuaire.
  // L'application demande le nom APRÈS vérification, quand elle sait déjà
  // qu'elle a affaire au titulaire du numéro.
  reserved 4;
  reserved "is_new_account";
}

message VerifyOtpRequest {
  string challenge_id = 1;
  string code = 2;
  string device_id = 3;
  // Renseigné à la première connexion d'un nouveau compte.
  string display_name = 4;
}

message LoginWithPasswordRequest {
  // E-mail ou téléphone.
  string login = 1;
  string password = 2;
  string device_id = 3;
}

message SetPasswordRequest {
  string account_id = 1;
  // Vide lors d'une définition initiale par un administrateur.
  string current_password = 2;
  string new_password = 3;
}

message SetPasswordResponse {
  bool ok = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string device_id = 2;
}

message RevokeTokenRequest {
  string refresh_token = 1;
}

message RevokeAllSessionsRequest {
  string account_id = 1;
}

message RevokeTokenResponse {
  int32 revoked_count = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in_seconds = 3;
  string token_type = 4;
  Principal principal = 5;
}

// Ce que les services lisent dans le jeton. Sert aussi de réponse à
// GetPrincipal, pour le back-office.
message Principal {
  string subject_id = 1;
  string phone = 2;
  string email = 3;
  string display_name = 4;
  repeated string roles = 5;
  // Renseigné pour merchant_owner / merchant_staff.
  string merchant_id = 6;
  // Renseigné pour partner.
  string partner_id = 7;
  // Renseigné pour driver.
  string driver_id = 8;
}

message Account {
  string id = 1;
  string phone = 2;
  string email = 3;
  string display_name = 4;
  repeated string roles = 5;
  AccountStatus status = 6;
  string merchant_id = 7;
  string driver_id = 8;
  bool has_password = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_login_at = 11;
  string status_reason = 12;
}

message GetWhatsAppConsentRequest {
}

message SetWhatsAppConsentRequest {
  // Vrai accorde, faux retire. REVOCABLE, comme le referentiel l'exige : la
  // meme route rend le consentement et le retire, il n'y a pas de chemin plus
  // difficile dans un sens que dans l'autre.
  bool granted = 1;
}

message WhatsAppConsent {
  bool granted = 1;
  // Date de l'accord. Vide quand le consentement n'est pas accorde — le retrait
  // efface la date, il ne garde pas la trace d'un accord revoque a cet endroit.
  // L'historique, lui, vit dans l'evenement AccountWhatsAppConsentChanged.
  google.protobuf.Timestamp granted_at = 2;
}

message GetPrincipalRequest {
  string subject_id = 1;
}

message CreateBackOfficeAccountRequest {
  string email = 1;
  string display_name = 2;
  // admin, ops, support ou finance.
  repeated string roles = 3;
  string initial_password = 4;
}

message CreateMerchantAccountRequest {
  string merchant_id = 1;
  string email = 2;
  string phone = 3;
  string display_name = 4;
  // merchant_owner ou merchant_staff.
  string role = 5;
  string initial_password = 6;
}

message SetAccountRolesRequest {
  string account_id = 1;
  repeated string roles = 2;
  string reason = 3;
}

message SuspendAccountRequest {
  string account_id = 1;
  string reason = 2;
}

message ReactivateAccountRequest {
  string account_id = 1;
  string reason = 2;
}

message CreatePartnerClientRequest {
  string partner_name = 1;
  // HBA_EXPRESS, HBA_FOOD ou PARTNER_API.
  string source = 2;
  string webhook_url = 3;
  repeated string scopes = 4;
  int32 rate_limit_per_minute = 5;
}

message RotatePartnerSecretRequest {
  string partner_id = 1;
  string reason = 2;
}

// Le secret client et le secret de signature ne sont renvoyés QU'ICI, une seule
// fois. Ils ne sont jamais relus en clair par la suite.
message PartnerClientCreated {
  string partner_id = 1;
  string client_id = 2;
  string client_secret = 3;
  string webhook_signing_secret = 4;
  repeated string scopes = 5;
  google.protobuf.Timestamp created_at = 6;
}

message IssuePartnerTokenRequest {
  string client_id = 1;
  string client_secret = 2;
  repeated string scopes = 3;
}

message GetPartnerWebhookConfigRequest {
  string partner_id = 1;
}

message PartnerWebhookConfig {
  string partner_id = 1;
  string webhook_url = 2;
  string signing_secret = 3;
  int32 rate_limit_per_minute = 4;
  bool enabled = 5;
}

message IssueServiceTokenRequest {
  // Nom du service appelant : delivery, dispatch, ...
  string client_id = 1;
  string client_secret = 2;
}

// Pas de jeton de rafraichissement : un service redemande, il ne rafraichit
// pas. Le sujet du jeton vaut « service:<client_id> » et sa liste de roles est
// vide.
message ServiceToken {
  string access_token = 1;
  int32 expires_in_seconds = 2;
  string token_type = 3;
}
