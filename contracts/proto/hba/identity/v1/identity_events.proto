syntax = "proto3";

package hba.identity.v1;

import "google/protobuf/timestamp.proto";
import "hba/common/v1/envelope.proto";
import "hba/identity/v1/identity_service.proto";

option csharp_namespace = "Hba.Contracts.Identity.V1";

// Topic : hba.identity.events.v1 — clé de partition : account_id.
message IdentityEvent {
  hba.common.v1.EventEnvelope envelope = 1;

  oneof payload {
    AccountRegistered registered = 10;
    AccountRolesChanged roles_changed = 11;
    AccountStatusChanged status_changed = 12;
    PartnerClientRegistered partner_registered = 13;
    AccountErased erased = 14;
  }
}

// Consommé par Directory, qui crée le profil correspondant. Le compte et le
// profil sont deux choses distinctes : Identity ne stocke pas d'adresses.
message AccountRegistered {
  string account_id = 1;
  string phone = 2;
  string email = 3;
  string display_name = 4;
  repeated string roles = 5;
  string merchant_id = 6;
  google.protobuf.Timestamp registered_at = 7;
}

// LE COMPTE N'EXISTE DEJA PLUS QUAND CET EVENEMENT PART.
//
// Il est publie dans la MEME transaction que la suppression de la ligne : sans
// cela, le compte disparaitrait et personne ne l'apprendrait — ni Directory,
// qui garde le nom, le courriel et les adresses, ni Media, qui garde la photo.
// C'est exactement ce que l'Outbox est la pour empecher.
//
// IL NE PORTE NI NOM NI TELEPHONE, ET C'EST TOUT L'INTERET. Un evenement de
// suppression qui recopierait l'identite du titulaire la ferait vivre dans
// Kafka pendant toute la retention du topic, precisement au moment ou quelqu'un
// demande a ce qu'elle disparaisse. L'identifiant suffit aux consommateurs pour
// retrouver ce qu'ils detiennent.
//
// LE MOTIF EST CELUI DE LA DEMANDE, PAS UNE RAISON LIBRE : la suppression n'est
// demandee que par le titulaire, et seul le delai de grace peut la separer du
// geste initial.
message AccountErased {
  string account_id = 1;
  // Quand le titulaire l'a demandee.
  google.protobuf.Timestamp requested_at = 2;
  // Quand l'effacement a reellement eu lieu, au terme du delai.
  google.protobuf.Timestamp erased_at = 3;
}

message AccountRolesChanged {
  string account_id = 1;
  repeated string previous_roles = 2;
  repeated string current_roles = 3;
  string changed_by = 4;
  string reason = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message AccountStatusChanged {
  string account_id = 1;
  AccountStatus previous = 2;
  AccountStatus current = 3;
  string changed_by = 4;
  string reason = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message PartnerClientRegistered {
  string partner_id = 1;
  string partner_name = 2;
  string source = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// L'ENVOI DU CODE NE PASSE PAS PAR CE TOPIC.
// Identity dépose une NotificationCommand (SendSms, modèle otp_login) dans son
// Outbox, à destination de hba.notification.commands.v1. Le code de connexion
// n'a donc aucune raison d'apparaître sur le topic des événements d'identité,
// que d'autres services consomment.
