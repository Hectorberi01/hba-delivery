syntax = "proto3";

package hba.delivery.v1;

import "google/protobuf/timestamp.proto";
import "hba/common/v1/envelope.proto";
import "hba/common/v1/geo.proto";
import "hba/common/v1/money.proto";
import "hba/delivery/v1/delivery_service.proto";
import  "hba/common/v1/enums.proto";
option csharp_namespace = "Hba.Contracts.Delivery.V1";

// Topic : hba.delivery.events.v1
// Clé de partition : delivery_id, pour garantir l'ordre par livraison.
message DeliveryEvent {
  hba.common.v1.EventEnvelope envelope = 1;

  oneof payload {
    DeliveryCreated created = 10;
    DeliveryConfirmed confirmed = 11;
    DriverAssigned driver_assigned = 12;
    DriverArrivedAtPickup driver_arrived_at_pickup = 13;
    DeliveryPickedUp picked_up = 14;
    DeliveryCompleted delivered = 15;
    DeliveryCancelled cancelled = 16;
    DeliveryFailed failed = 17;
    NoDriverFound no_driver_found = 18;
  }
}

message DeliveryCreated {
  string delivery_id = 1; // id
  string reference = 2; // référence
  hba.common.v1.Source source = 3; // source de création de la livraison
  string customer_id = 4; // id du client
  string merchant_id = 5; // id du marchant
  hba.common.v1.Location pickup = 6; // lieu de récupération du  colis
  hba.common.v1.Location dropoff = 7; // lieu de dépôt du  colis
  hba.common.v1.Money total = 8; // le montant de livraison
}

// Paiement confirmé : la livraison peut entrer en dispatch. C'est cet événement
// que Dispatch consomme pour déclencher la première vague d'offres.
message DeliveryConfirmed {
  string delivery_id = 1;
  hba.common.v1.Location pickup = 2;
  hba.common.v1.Location dropoff = 3;
  hba.common.v1.Money driver_earning = 4;
  int32 distance_meters = 5;
  google.protobuf.Timestamp paid_at = 6;
}

// la livraison est attribué à un livreur
message DriverAssigned {
  string delivery_id = 1;
  string driver_id = 2;
  string offer_id = 3;
  google.protobuf.Timestamp assigned_at = 4;
}

// le livreur est arrivé au lieu de prise en charge
message DriverArrivedAtPickup {
  string delivery_id = 1;
  string driver_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// colis récupérer par le livreur
message DeliveryPickedUp {
  string delivery_id = 1;
  string driver_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// livraison réaliser complet
// Consommé par Driver pour rendre le livreur DISPONIBLE : sans cela il reste
// ON_MISSION indéfiniment, invisible pour toutes les vagues suivantes, et sans
// même pouvoir se mettre hors ligne — la machine à états le lui interdit
// pendant une mission.
message DeliveryCompleted {
  string delivery_id = 1;
  string driver_id = 2;
  hba.common.v1.Money driver_earning = 3;
  google.protobuf.Timestamp occurred_at = 4;

  // Référence lisible de la course — « HBA-835GZ5 ».
  //
  // ELLE VOYAGE AVEC L'EVENEMENT PARCE QUE PERSONNE NE PEUT ALLER LA
  // CHERCHER. Payment inscrit cette course au compte du livreur et n'a pas le
  // droit de lire la base de Delivery ; un relevé qui n'afficherait que des
  // UUID serait illisible pour le livreur comme pour la finance. La référence
  // ne change jamais, la recopier ne crée aucune divergence.
  string reference = 5;
}

// livraison annulé
message DeliveryCancelled {
  string delivery_id = 1;
  hba.common.v1.ActorType cancelled_by = 2;
  string actor_id = 3;
  string reason = 4;
  // Statut au moment de l'annulation : détermine la politique de remboursement.
  DeliveryStatus previous_status = 5;
  google.protobuf.Timestamp occurred_at = 6;

  // Livreur affecté au moment de l'annulation, vide s'il n'y en avait aucun.
  //
  // IL SERT A LE LIBERER, ET RIEN D'AUTRE. Une course annulée alors qu'un
  // livreur l'avait acceptée le laissait ON_MISSION pour toujours : plus
  // aucune offre, et pas même le droit de se mettre hors ligne.
  string driver_id = 7;
}

message DeliveryFailed {
  string delivery_id = 1;
  string reason = 2;
  google.protobuf.Timestamp occurred_at = 3;

  // Même raison que pour l'annulation : libérer le livreur affecté.
  string driver_id = 4;
}

message NoDriverFound {
  string delivery_id = 1;
  int32 waves_attempted = 2;
  google.protobuf.Timestamp occurred_at = 3;
}
