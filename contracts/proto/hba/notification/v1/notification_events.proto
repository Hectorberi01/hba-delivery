syntax = "proto3";

package hba.notification.v1;

import "hba/common/v1/envelope.proto";

option csharp_namespace = "Hba.Contracts.Notification.V1";

// Topic : hba.notification.commands.v1
// Notification n'a presque que des consommateurs. Les autres services publient
// des événements métier ; Notification décide du canal et du modèle de message.
message NotificationCommand {
  hba.common.v1.EventEnvelope envelope = 1;

  oneof payload {
    SendSms send_sms = 10;
    SendWhatsApp send_whatsapp = 11;
    SendPush send_push = 12;
    SendEmail send_email = 13;
  }
}

message SendSms {
  // Le numéro, quand celui qui publie le connaît : Identity envoie un code à un
  // téléphone qu'il détient, Delivery un code de remise au destinataire d'un
  // colis, dont le numéro est dans la course.
  //
  // VIDE QUAND LE DESTINATAIRE EST UN TITULAIRE DE COMPTE. Renseignez alors
  // subject_id, et Notification demande le numéro à Directory.
  string to_phone = 1;
  string template_id = 2;
  map<string, string> variables = 3;

  // Le compte destinataire, quand son numéro n'est pas connu de l'émetteur.
  //
  // CE CHAMP MANQUAIT, ET SON ABSENCE A LAISSÉ DEUX MODÈLES MORTS.
  // « delivery_assigned » et « delivery_completed » existent dans le catalogue
  // depuis l'origine et n'ont JAMAIS eu de producteur : Delivery ne connaît que
  // le CustomerId de son client, et SendSms exigeait un numéro. Aucun client
  // n'a donc jamais été prévenu qu'un livreur avait pris son colis.
  //
  // LA FORME EST CELLE DE SendEmail ET DE SendPush, pour la raison que leur
  // commentaire donne déjà : Notification résout l'adresse au moment d'envoyer,
  // parce que la faire chercher par le service métier mettrait un appel réseau
  // dans la transaction qui clôt une course.
  //
  // L'UN OU L'AUTRE, PAS LES DEUX. Si to_phone est renseigné, il gagne : c'est
  // le seul moyen d'écrire à quelqu'un qui n'a pas de compte.
  string subject_id = 4;
}

message SendWhatsApp {
  string to_phone = 1;
  string template_id = 2;
  map<string, string> variables = 3;

  // Même raison que pour SendSms. Attention : WhatsApp exige l'opt-in du
  // titulaire, ce qu'un compte HBA porte — mais pas un destinataire de colis.
  string subject_id = 4;
}

message SendPush {
  string subject_id = 1;
  string template_id = 2;
  map<string, string> variables = 3;
}

// L'ADRESSE N'EST PAS DANS LA COMMANDE, ET C'EST LE POINT DELICAT.
//
// SendSms et SendWhatsApp portent un numero parce que celui qui les publie le
// connait : Identity envoie un code a un telephone qu'il detient. Pour un recu
// de course, l'adresse vit dans Directory, et le service qui sait qu'une course
// est terminee est Delivery, qui ne l'a pas.
//
// TROIS ISSUES, UNE SEULE TENABLE. Faire appeler Directory par Delivery au
// moment de clore la course mettrait un appel reseau dans la transaction qui
// termine une livraison : Directory injoignable, et le livreur ne peut plus
// clore sa mission. Faire publier la commande par Directory ferait de
// l'annuaire un producteur de notifications, ce qu'il n'est pas. Reste la
// troisieme : Notification resout l'adresse lui-meme, au moment d'envoyer.
// C'est deja sa raison d'etre — « Notification decide du canal et du modele » —
// et un echec de resolution ne coute alors qu'un renvoi, pas une course bloquee.
//
// C'EST AUSSI LA FORME DE SendPush, qui porte un subject_id pour la meme
// raison : un jeton d'appareil ne se connait pas depuis le service metier.
//
// UN CLIENT SANS COURRIEL N'EST PAS UNE ERREUR. Le courriel est facultatif
// dans ce produit ; l'envoi est alors consigne « ignore », avec son motif.
message SendEmail {
  // Le compte destinataire. Notification demande son adresse a Directory.
  string subject_id = 1;
  string template_id = 2;
  map<string, string> variables = 3;
}
