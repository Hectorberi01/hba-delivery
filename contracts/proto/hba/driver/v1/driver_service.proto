syntax = "proto3";

package hba.driver.v1;

import "google/protobuf/timestamp.proto";
import "hba/common/v1/time.proto";
import "hba/common/v1/enums.proto";
import "hba/common/v1/geo.proto";

option csharp_namespace = "Hba.Contracts.Driver.V1";

service DriverService {
  rpc GetDriver(GetDriverRequest) returns (Driver);
  // Profil réduit exposé au client et au commerçant pendant la mission :
  // nom, véhicule, téléphone. Rien de plus.
  rpc GetDriverPublicProfile(GetDriverRequest) returns (DriverPublicProfile);
  rpc GoOnline(GoOnlineRequest) returns (Driver);
  rpc GoOffline(GoOfflineRequest) returns (Driver);

  // LES POSITIONS ONT QUITTÉ CE SERVICE le 1er octobre 2026. UpdateLocation,
  // FindAvailableNearby et ListDriverPositions sont partis dans
  // hba.location.v1.LocationService. Driver répond « qui est le chauffeur » ;
  // Location répond « où est-il ». Ce qui reste ici, ci-dessous, est le versant
  // « qui » du croisement que l'appelant fait lui-même.

  // Parmi CES chauffeurs, lesquels peuvent recevoir une offre ?
  //
  // C'EST LA MOITIÉ D'UNE RECHERCHE DE PROXIMITÉ, et l'autre moitié est chez
  // Location. L'appelant demande d'abord les identifiants les plus proches, puis
  // pose cette question : qui est vérifié, en ligne, libre, sur le bon véhicule et
  // habilité pour cette nature de mission. Driver ne reçoit aucune coordonnée et
  // n'en rend aucune.
  //
  // L'ORDRE D'ENTRÉE N'EST PAS CONSERVÉ EN SORTIE, et l'appelant ne doit pas s'y
  // fier : c'est une lecture par identifiants, pas un classement. Le classement par
  // distance appartient à celui qui a interrogé Location.
  rpc FilterAvailableDrivers(FilterAvailableDriversRequest) returns (FilterAvailableDriversResponse);

  // Ces livreurs-là, tels que la CARTE DU CLIENT a le droit de les montrer.
  //
  // POURQUOI ELLE NE PASSE PLUS PAR FilterAvailableDrivers. Depuis le 3 octobre
  // 2026, la carte du client montre TOUS les livreurs du rayon, en distinguant
  // ceux qui peuvent prendre la mission (point 24, troisième révision). Le filtre
  // ne convient donc plus : il écarte précisément ceux qu'il faut afficher en
  // éteint.
  //
  // ET POURQUOI PAS GetDriverSummaries NON PLUS : celle-là rend un nom et un
  // téléphone, et elle est réservée au back-office. Un client n'a droit ni à
  // l'un ni à l'autre — jamais, pas même pendant une mission qui n'est pas la
  // sienne.
  //
  // CE QU'ELLE REND, ET RIEN DE PLUS : le véhicule et la disponibilité. Pas de
  // nom, pas de plaque, pas de téléphone. L'identifiant ne sert qu'à recoller la
  // position chez l'appelant, et la passerelle le jette avant le client.
  rpc GetDriverPins(GetDriverPinsRequest) returns (GetDriverPinsResponse);

  // Qui sont CES chauffeurs ? Nom, véhicule, états — par identifiants, en un appel.
  //
  // POUR LA CARTE DE L'EXPLOITATION, qui montre aussi les chauffeurs en course ou
  // hors ligne : elle ne peut donc pas passer par FilterAvailableDrivers, qui ne
  // rend que les offrables. Elle lit les positions chez Location, puis nomme les
  // chauffeurs ici.
  //
  // RÉSERVÉ À admin, ops, support ET finance, vérifié dans le service et pas
  // seulement à la passerelle : un nom et un téléphone ne sont pas un profil public.
  rpc GetDriverSummaries(GetDriverSummariesRequest) returns (GetDriverSummariesResponse);
  // --- Constitution du dossier par le livreur lui-même (ADR 0021) ---
  //
  // LE DÉPÔT D'UNE PIÈCE N'EST PAS ICI, et c'est délibéré : les octets
  // arrivent par `POST /internal/v1/drivers/{id}/documents`, en HTTP, sur le
  // port 8080 de ce service. C'est la seule exception à l'ADR 0002, et elle
  // est motivée dans l'ADR 0021 — un binaire qui traverse gRPC traverse aussi
  // les intercepteurs de trace, où une pièce d'identité n'a rien à faire.
  rpc DeclareVehicle(DeclareVehicleRequest) returns (Driver);
  rpc DeclareCapabilities(DeclareCapabilitiesRequest) returns (Driver);
  // Envoie le dossier à l'examen. Refuse un dossier incomplet.
  rpc SubmitApplication(SubmitApplicationRequest) returns (Driver);
  // Les pièces d'un livreur, avec une URL signée à courte durée par pièce.
  // Réservé au livreur concerné et au back-office.
  rpc GetApplication(GetDriverRequest) returns (DriverApplication);

  // Crée le profil du porteur du jeton s'il n'existe pas.
  //
  // LE RATTRAPAGE DE L'ÉVÉNEMENT PERDU. Le profil naît normalement de
  // AccountRegistered ; quand cet événement se perd, le livreur a un compte
  // valide et un GET /me qui répond 404 à vie. Le client avait déjà sa porte de
  // secours, le livreur non.
  //
  // AUCUN PARAMÈTRE : le nom et le téléphone viennent du jeton, jamais du
  // corps. Idempotente.
  rpc EnsureDriver(EnsureDriverRequest) returns (Driver);

  // Admin : décision KYC. Auditée.
  rpc ReviewKyc(ReviewKycRequest) returns (Driver);
  rpc SuspendDriver(SuspendDriverRequest) returns (Driver);

  // Lève une suspension. SANS ELLE, SUSPENDRE ÉTAIT DÉFINITIF : plus aucune
  // méthode du domaine n'acceptait un compte suspendu, et la seule réparation
  // passait par la base. Le dossier retrouve l'état qu'il avait — validé s'il
  // l'était, en attente d'examen sinon.
  rpc ReinstateDriver(ReinstateDriverRequest) returns (Driver);

  // Back-office : l'annuaire. RESERVE AUX ROLES admin, ops, support et
  // finance, et la verification est dans le handler — un annuaire de livreurs
  // porte des noms et des telephones, ce n'est pas un profil public.
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);

  // Back-office : les effectifs. Même réserve que l'annuaire.
  rpc GetDriverStats(GetDriverStatsRequest) returns (DriverStats);

  // « CE livreur peut-il recevoir une offre ? »
  //
  // IL NE REÇOIT PLUS DE POINT DE RÉFÉRENCE ET NE REND PLUS DE DISTANCE depuis que
  // les positions ont quitté ce service. Driver rend le verdict qui lui appartient
  // — dossier, état, mission en cours — et l'appelant ajoute la question de la
  // position en interrogeant Location. DRIVER_POSITION_STALE n'est donc plus un
  // motif que Driver sache prononcer : c'est devenu le verdict de celui qui croise.
  //
  // Sert à l'affectation manuelle par l'exploitation, et à griser le bouton AVANT
  // qu'on appuie dessus.
  rpc CheckDriverAvailability(CheckDriverAvailabilityRequest) returns (DriverAvailability);
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING_VERIFICATION = 1;
  VERIFICATION_STATUS_VERIFIED = 2;
  VERIFICATION_STATUS_REJECTED = 3;
  VERIFICATION_STATUS_SUSPENDED = 4;
}

enum OperationalStatus {
  OPERATIONAL_STATUS_UNSPECIFIED = 0;
  OPERATIONAL_STATUS_OFFLINE = 1;
  OPERATIONAL_STATUS_AVAILABLE = 2;
  // Une offre est en cours : le livreur ne peut pas en recevoir une autre.
  OPERATIONAL_STATUS_RESERVED = 3;
  OPERATIONAL_STATUS_ON_MISSION = 4;
}

// Nature d'une pièce du dossier. LA LISTE VIENT DU RÉFÉRENTIEL : « documents
// KYC (CNI, permis, carte grise, photo) ». Rien n'y a été ajouté.
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_NATIONAL_ID = 1;
  DOCUMENT_TYPE_DRIVING_LICENCE = 2;
  DOCUMENT_TYPE_VEHICLE_REGISTRATION = 3;
  // Photo d'identité, PIÈCE DU DOSSIER — à ne pas confondre avec la photo de
  // profil, qui n'est pas une pièce et ne passe pas par l'examen (ADR 0021).
  DOCUMENT_TYPE_IDENTITY_PHOTO = 4;
  DOCUMENT_TYPE_VEHICLE_PHOTO = 5;
}

message Vehicle {
  hba.common.v1.VehicleType type = 1;
  string plate = 2;
  int32 capacity_grams = 3;

  // Déclaratifs : ils servent au client à reconnaître le véhicule qui arrive,
  // pas à autoriser quoi que ce soit. « La voiture bleue » se lit à trente
  // mètres, une immatriculation non.
  string brand = 4;
  string model = 5;
  string color = 6;

  // Places passagers, conducteur non compris. ZÉRO VAUT « AUCUNE », pas
  // « inconnu » : un véhicule qui n'a pas déclaré de place n'en prend pas.
  int32 passenger_capacity = 7;
}

message Driver {
  string id = 1;
  string display_name = 2;
  string phone = 3;
  Vehicle vehicle = 4;
  VerificationStatus verification_status = 5;
  OperationalStatus operational_status = 6;
  google.protobuf.Timestamp registered_at = 7;
  google.protobuf.Timestamp verified_at = 8;
  // Motif de REJECTED / SUSPENDED.
  string status_reason = 9;

  // Ce que ce livreur a déclaré exercer. VIDE VEUT DIRE « LE COLIS » : c'est le
  // socle, il ne se déclare pas.
  repeated hba.common.v1.DriverCapability capabilities = 10;
}

message DriverPublicProfile {
  string driver_id = 1;
  string display_name = 2;
  string phone = 3;
  hba.common.v1.VehicleType vehicle_type = 4;
  string vehicle_plate = 5;

  // AJOUTES POUR LE TRANSPORT DE PERSONNES, et utiles au colis aussi. Le
  // vehicule portait deja ces trois champs (voir Vehicle) mais ils s'arretaient
  // dans le service : le profil public, lui, ne rendait que le type et la
  // plaque. Un passager qui attend au bord d'une rue de Cotonou cherche « la
  // voiture blanche », pas une immatriculation illisible a trente metres.
  //
  // VIDES POUR LES LIVREURS QUI NE LES ONT PAS DECLARES : ce sont des champs
  // declaratifs, ils n'autorisent rien.
  string vehicle_brand = 6;
  string vehicle_model = 7;
  string vehicle_color = 8;
}

message GetDriverRequest {
  string driver_id = 1;
}

message GoOnlineRequest {
  string driver_id = 1;
  hba.common.v1.GeoPoint position = 2;
}

message GoOfflineRequest {
  string driver_id = 1;
}

// ---- Le croisement : Driver répond « qui », Location répond « où » ----------
//
// AUCUNE COORDONNÉE N'ENTRE NI NE SORT D'ICI. C'est ce qui distingue ces deux
// appels de la recherche de proximité qu'ils ont remplacée : ils prennent une
// liste d'identifiants et rendent ce que la base sait d'eux.

message FilterAvailableDriversRequest {
  // Les candidats, tels que Location les a rendus. Vide, la réponse est vide : ce
  // n'est pas « tous les livreurs ».
  repeated string driver_ids = 1;

  // Le véhicule exigé par la mission. NON PRÉCISÉ VAUT « n'importe lequel » — c'est
  // le cas de toutes les livraisons de colis, dont l'événement ne transporte pas le
  // poids : filtrer sur un type qu'on ne connaît pas inventerait une règle.
  hba.common.v1.VehicleType vehicle_type = 2;

  // L'habilitation exigée par la mission.
  //
  // NON PRÉCISÉE VAUT « LIVRAISON DE COLIS », et ce n'est pas un défaut arbitraire :
  // c'est ce que faisaient tous les appelants avant que les habilitations existent.
  // Un cycliste ne doit pas recevoir une course de personnes parce qu'un appelant a
  // oublié le champ.
  hba.common.v1.DriverCapability required_capability = 3;
}

message EligibleDriver {
  string driver_id = 1;

  // Le véhicule, pour que la carte du client montre une moto, un vélo, un tricycle
  // ou une voiture — et non quatre pastilles identiques. Point 24, révisé le
  // 30 septembre 2026.
  //
  // IL VIENT DE LA BASE, PAS DE L'INDEX GÉOGRAPHIQUE : Location ne sait pas avec
  // quoi roule chacun, et n'a pas à le savoir.
  hba.common.v1.VehicleType vehicle_type = 2;
}

message FilterAvailableDriversResponse {
  repeated EligibleDriver drivers = 1;
}

message GetDriverSummariesRequest {
  repeated string driver_ids = 1;
}

message DriverSummary {
  string driver_id = 1;
  string display_name = 2;
  VerificationStatus verification_status = 3;
  OperationalStatus operational_status = 4;
  hba.common.v1.VehicleType vehicle_type = 5;
}

message GetDriverSummariesResponse {
  // UN IDENTIFIANT INCONNU EST SIMPLEMENT ABSENT DE LA RÉPONSE, sans erreur. Les
  // identifiants viennent d'un index Redis qui peut garder la trace d'un compte
  // supprimé en base ; faire échouer la carte entière pour un point orphelin serait
  // une panne là où il suffit de ne pas le dessiner.
  repeated DriverSummary drivers = 1;
}

message ReviewKycRequest {
  string driver_id = 1;
  bool approved = 2;
  // Obligatoire en cas de refus.
  string reason = 3;
}

message SuspendDriverRequest {
  string driver_id = 1;
  string reason = 2;
}

message EnsureDriverRequest {}

message ReinstateDriverRequest {
  string driver_id = 1;
  // Motivée comme la suspension : l'audit doit dire pourquoi on revient dessus.
  string reason = 2;
}

message ListDriversRequest {
  // Recherche libre sur le nom ou le telephone. Vide = tout l'annuaire.
  string query = 1;
  // UNSPECIFIED vaut « tous », pas « le statut zero » : c'est la valeur par
  // defaut de protobuf, la traiter comme un filtre ne rendrait personne.
  VerificationStatus verification_status = 2;
  OperationalStatus operational_status = 3;
  int32 page_size = 4;
  int32 offset = 5;
}

message ListDriversResponse {
  repeated Driver drivers = 1;
  // Total correspondant au filtre, toutes pages confondues.
  int32 total = 2;
}

message CheckDriverAvailabilityRequest {
  string driver_id = 1;

  // LE POINT DE RÉFÉRENCE A DISPARU, ET SON NUMÉRO EST RÉSERVÉ. Driver ne mesure
  // plus de distance : il ne sait plus où sont les gens. Réserver le 2 empêche qu'un
  // champ futur réutilise ce numéro et reçoive, d'un binaire ancien, un point GPS
  // qu'il interpréterait comme autre chose.
  reserved 2;
}

message DriverAvailability {
  string driver_id = 1;
  string display_name = 2;
  bool offerable = 3;

  // Renseigné si offerable = false : DRIVER_NOT_FOUND, DRIVER_NOT_VERIFIED,
  // DRIVER_NOT_AVAILABLE.
  //
  // UN BOOLÉEN SEUL NE SUFFIT PAS : les motifs appellent des gestes différents —
  // valider un dossier, attendre la fin d'une course, rappeler quelqu'un.
  //
  // DRIVER_POSITION_STALE N'EST PLUS PRONONCÉ ICI. Ce motif-là appartient désormais
  // à celui qui croise : il interroge Location, et conclut lui-même que le téléphone
  // est éteint. Driver qui le dirait prétendrait savoir où se trouve quelqu'un.
  string reason = 4;

  VerificationStatus verification_status = 5;
  OperationalStatus operational_status = 6;

  // LA DISTANCE, LA POSITION ET L'HORODATAGE SONT PARTIS AVEC ELLE. Leurs numéros
  // restent réservés pour la même raison que le 2 ci-dessus : un ancien appelant
  // enverrait ou lirait des coordonnées là où un champ neuf attendrait autre chose.
  reserved 7, 8, 9;
}

message GetDriverStatsRequest {
  // Ne s'applique QU'AUX FLUX — inscriptions et validations. Les effectifs,
  // eux, n'ont pas de fenêtre. Absente, elle vaut les trente derniers jours
  // (ADR 0019).
  hba.common.v1.TimeWindow window = 1;
}

message VerificationStatusCount {
  VerificationStatus status = 1;
  int64 count = 2;
}

message OperationalStatusCount {
  OperationalStatus status = 1;
  int64 count = 2;
}

// DEUX NATURES DE CHIFFRES DANS LE MEME MESSAGE, ET ELLES NE SE LISENT PAS
// PAREIL.
//
// Les effectifs sont un ETAT, pris à l'instant de la lecture : « combien de
// livreurs sont disponibles » n'a pas de période. Une fenêtre appliquée à ces
// compteurs ne voudrait rien dire — un livreur n'est pas disponible « en
// septembre », il l'est maintenant.
//
// Les flux sont un MOUVEMENT sur la fenêtre : qui s'est inscrit, quels
// dossiers ont été validés.
message DriverStats {
  // La fenêtre appliquée aux flux uniquement.
  hba.common.v1.TimeWindow window = 1;

  // --- Effectifs, à l'instant de la lecture ---
  int64 total = 2;
  repeated VerificationStatusCount by_verification = 3;
  repeated OperationalStatusCount by_operational = 4;

  // --- Flux, sur la fenêtre ---
  int64 registered_in_window = 5;
  int64 verified_in_window = 6;
}

// ------------------------------------ Dossier du livreur (ADR 0021) ---------

message DeclareVehicleRequest {
  string driver_id = 1;
  hba.common.v1.VehicleType type = 2;
  // Obligatoire ici, contrairement à l'inscription : ops la compare à la
  // carte grise. SAUF POUR UN VÉLO, qui n'en porte pas.
  string plate = 3;
  int32 capacity_grams = 4;

  string brand = 5;
  string model = 6;
  string color = 7;

  // Refusé si le type de véhicule ne transporte pas de personnes : le service
  // répond VEHICLE_CANNOT_CARRY_PASSENGERS plutôt que d'ignorer la valeur.
  int32 passenger_capacity = 8;
}

message DeclareCapabilitiesRequest {
  string driver_id = 1;

  // L'ENSEMBLE COMPLET, PAS UN AJOUT. Ce qui n'est pas dans cette liste est
  // retiré : retirer une habilitation doit être aussi simple que l'accorder,
  // sinon elle ne se retire jamais.
  repeated hba.common.v1.DriverCapability capabilities = 2;
}

message SubmitApplicationRequest {
  string driver_id = 1;
}

message DocumentSummary {
  DocumentType type = 1;
  google.protobuf.Timestamp uploaded_at = 2;
  int64 size_bytes = 3;
  string content_type = 4;

  // URL SIGNÉE, À COURTE DURÉE. La clé de stockage ne sort jamais du service :
  // elle serait devinable d'un livreur à l'autre, et le tableau de visibilité
  // du référentiel réserve les pièces à leur propriétaire et à l'admin.
  string read_url = 5;
  google.protobuf.Timestamp read_url_expires_at = 6;
}

message DriverApplication {
  string driver_id = 1;
  VerificationStatus verification_status = 2;
  // Motif d'un refus. C'est la seule chose qui dise au livreur quoi corriger.
  string status_reason = 3;
  google.protobuf.Timestamp submitted_at = 4;

  repeated DocumentSummary documents = 5;

  // Pièces encore attendues. VIDE NE VEUT PAS DIRE « PRÊT » : le véhicule
  // doit aussi être déclaré, ce que dit `can_submit`.
  repeated DocumentType missing_documents = 6;

  Vehicle vehicle = 7;
  string profile_photo_url = 8;

  // Pièces exigées POUR CE VÉHICULE-LÀ, déposées ou non.
  //
  // ELLE EXISTE PARCE QU'ELLE A CESSÉ D'ÊTRE LA MÊME POUR TOUT LE MONDE. Un
  // vélo n'exige ni permis ni carte grise (décidé le 30 septembre 2026), et
  // l'application affichait jusque-là les cinq pièces en dur : un cycliste
  // voyait deux lignes qu'il ne pourrait jamais satisfaire.
  //
  // LE SERVICE LA CALCULE, ET C'EST LE MÊME PRINCIPE QUE `can_submit` : la
  // règle est métier, et chaque client qui la recalculerait finirait par en
  // avoir sa propre version.
  repeated DocumentType required_documents = 10;

  // Le véhicule a-t-il été déclaré ?
  //
  // L'APPLICATION LE DEVINAIT PAR « la plaque n'est pas vide », faute de mieux :
  // le type naît à MOTORCYCLE sans que personne ne l'ait dit, donc il ne
  // distinguait pas un motard déclaré d'un livreur qui n'a rien saisi. Un vélo
  // n'a pas de plaque — il serait resté « non déclaré » pour toujours.
  bool vehicle_declared = 11;

  // Le dossier peut-il partir à l'examen ? Calculé par le service, parce que
  // la règle est métier : chaque client qui la recalculerait finirait par en
  // avoir sa propre version.
  bool can_submit = 9;

  // Ce que ce livreur a déclaré exercer. VIDE VEUT DIRE « LE COLIS » : c'est le
  // socle, il ne se déclare pas.
  //
  // AJOUTÉ LE 1er OCTOBRE 2026 (point 38). Le dossier ne portait pas les
  // habilitations : l'application n'avait aucun moyen d'afficher ce que le
  // livreur avait déclaré, ni de recocher ses cases au retour sur l'écran.
  repeated hba.common.v1.DriverCapability capabilities = 12;

  // Ce que le VÉHICULE DÉCLARÉ permet, habilité ou non.
  //
  // CALCULÉ PAR LE SERVICE, pour la même raison que `required_documents` et
  // `can_submit` : la table véhicule → habilitations est une règle métier, et
  // chaque client qui la recalculerait finirait par en avoir sa propre version.
  // Une application qui l'aurait codée en dur proposerait « transport de
  // personnes » à un cycliste, et le refus n'arriverait qu'à l'enregistrement.
  //
  // IL CONTIENT LE COLIS, lui aussi : ce champ répond à « que permet ce
  // véhicule », pas à « que faut-il afficher ». Le colis étant le socle, c'est
  // à l'interface de ne pas le proposer comme une case à cocher.
  repeated hba.common.v1.DriverCapability allowed_capabilities = 13;
}

message GetDriverPinsRequest {
  // Les candidats, tels que Location les a rendus. Vide, la réponse est vide :
  // ce n'est pas « tous les livreurs ».
  repeated string driver_ids = 1;
}

message DriverPin {
  // IL NE SORT PAS DE LA PASSERELLE. Il sert à recoller chaque pastille à sa
  // position ; la frontière du client le jette. Voir point 24 : un identifiant
  // stable permettrait de reconnaître le même livreur d'un jour sur l'autre.
  string driver_id = 1;

  hba.common.v1.VehicleType vehicle_type = 2;

  // Peut-il prendre une mission maintenant ? Dossier valide, en ligne, libre, et
  // habilité au colis.
  //
  // IL NE DIT PAS POURQUOI, et c'est volontaire : « indisponible » couvre la
  // mission en cours, la déconnexion récente et le dossier redevenu invalide.
  // Rendre la raison en dirait bien plus sur chacun que ce que la carte demande.
  bool available = 3;
}

message GetDriverPinsResponse {
  repeated DriverPin pins = 1;
}
