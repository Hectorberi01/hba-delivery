# Garage — stockage objet auto-heberge (ADR 0021).
#
# IL NE SERT RIEN AVANT INITIALISATION. Contrairement a la plupart des
# conteneurs, « up -d » ne suffit pas : tant qu'aucune disposition n'est
# appliquee, Garage repond « no storage nodes ». Voir deploy/garage/init.sh,
# ou « make garage-init ».

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

# UNE SEULE COPIE, PARCE QU'IL N'Y A QU'UN NOEUD. Demander 3 sur un pilote
# mono-machine ferait refuser toute ecriture : Garage n'ecrit pas s'il ne peut
# pas satisfaire le facteur demande.
replication_factor = 1

# Consistance forte : sur un seul noeud, elle ne coute rien et evite qu'une
# piece tout juste deposee soit introuvable a la relecture.
consistency_mode = "consistent"

# LE SECRET DU PROTOCOLE ENTRE NOEUDS N'EST PLUS ICI, ET C'EST UNE CORRECTION
# D'INCIDENT DU 30 SEPTEMBRE 2026.
#
# Il etait ecrit en clair dans ce fichier, suivi par git, dans un depot PUBLIC.
# Le commentaire d'origine l'assumait — « cette valeur est celle du
# developpement, elle est dans le depot, donc publique ; en production, elle se
# regenere » — mais RIEN NE LA REGENERAIT, et deploy/compose.infra.yml monte
# exactement ce fichier. La production allait donc tourner avec un secret que
# n'importe qui pouvait lire sur raw.githubusercontent.com.
#
# Il arrive desormais par la variable d'environnement GARAGE_RPC_SECRET, depuis
# deploy/.env qui n'est pas versionne. Garage accepte trois formes pour chaque
# secret — « rpc_secret », « rpc_secret_file », ou la variable — et la variable
# prime sur le fichier ; l'une et l'autre des deux premieres sont exclusives.
#
# ET SON ABSENCE FAIT ECHOUER LE DEMARRAGE, ce qui est la propriete qu'on
# cherche : Garage refuse de demarrer sans secret RPC. Un oubli se voit tout de
# suite, au lieu de passer inapercu derriere une valeur publique.
#
#   ./scripts/garage-secrets.sh --si-absent   # premiere installation
#   ./scripts/garage-secrets.sh               # rotation
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "hba"
api_bind_addr = "[::]:3900"
# L'adressage par chemin, et non par sous-domaine : « garage/hba-media »
# plutot que « hba-media.garage ». Sans cela, le SDK construirait un
# nom d'hote que le reseau Docker ne resout pas.
root_domain = ".s3.hba.local"

[admin]
api_bind_addr = "[::]:3903"
# LES DEUX JETONS D'ADMINISTRATION SONT PARTIS AVEC LE SECRET RPC, meme raison,
# meme date. Ils arrivent par GARAGE_ADMIN_TOKEN et GARAGE_METRICS_TOKEN.
#
# AU PASSAGE, LE COMMENTAIRE QUI ETAIT ICI ETAIT FAUX. Il disait le jeton
# d'administration « utilise par le script d'initialisation » : scripts/garage-init.sh
# passe par la CLI dans le conteneur (« docker compose exec garage /garage … »),
# qui lit ce fichier de configuration et n'a besoin d'aucun jeton HTTP. Rien,
# dans le depot, n'appelait l'API d'administration. Le jeton etait donc expose
# sans meme etre utilise.
#
# A TRANCHER, ET NON IMPLEMENTE ICI : depuis Garage v2, ces deux jetons
# « maitres » sont decourages au profit de jetons crees a la demande
# (« garage admin-token create --expires-in 30d --scope … »), qui se limitent a
# un sous-ensemble d'appels, expirent et se revoquent un par un. Y passer est un
# choix d'exploitation, pas une correction de faille.
