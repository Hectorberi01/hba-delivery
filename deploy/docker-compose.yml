# Environnement de développement local.
# Démarrage : docker compose -f deploy/docker-compose.yml up -d
# Les services .NET tournent depuis l'IDE et se connectent à ces dépendances.

name: hba-delivery-dev

services:
  postgres:
    networks: [hba-internal]
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hba}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hba"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    networks: [hba-internal]
    image: redis:7-alpine
    # Le mot de passe n'est pas cosmetique en developpement : sans lui, un service
    # conteneurise qui envoie AUTH se fait rejeter par « no password is set ».
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-hba-redis-dev}",
              "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-hba-redis-dev}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka en mode KRaft : pas de ZooKeeper.
  kafka:
    networks: [hba-internal]
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      # Image officielle ASF : les variables sont des proprietes server.properties
      # prefixees KAFKA_, les points remplaces par des soulignes. Pas de _CFG_,
      # c'etait une convention propre a Bitnami.
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Noeud unique : les topics internes ne peuvent pas etre repliques.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Création des topics une fois pour toutes : la création automatique est
  # désactivée, sinon une faute de frappe crée un topic au lieu d'échouer.
  kafka-init:
    networks: [hba-internal]
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: "kafka:9094"
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  kafka-ui:
    networks: [hba-internal]
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hba-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: "true"

  # STOCKAGE OBJET — Garage (ADR 0021). Il remplace le bloc MinIO neutralise :
  # MinIO a retire ses images publiques en septembre 2026, et le point 14 a ete
  # tranche quand l'inscription du livreur a eu besoin d'ecrire des binaires.
  #
  # « up -d » NE SUFFIT PAS. Garage repond « no storage nodes » tant qu'aucune
  # disposition n'est appliquee. Apres le premier demarrage :
  #
  #   make garage-init
  #
  # L'IMAGE NE CONTIENT QUE LE BINAIRE : pas de shell, pas de coreutils. Un
  # script monte ici ne s'executerait pas — l'initialisation se pilote donc
  # depuis l'hote, une commande a la fois (scripts/garage-init.sh).
  garage:
    image: dxflrs/garage:v2.4.1
    networks: [hba-internal]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      # LES TROIS SECRETS ARRIVENT D'ICI, PLUS DU FICHIER DE CONFIGURATION.
      # Ils etaient en clair dans garage.toml, suivi par git dans un depot
      # public (corrige le 30/09/2026). Ils vivent dans deploy/.env, qui n'est
      # pas versionne ; « ./scripts/garage-secrets.sh » les pose.
      #
      # LA FORME « :? » FAIT ECHOUER COMPOSE AVEC CE MESSAGE si la variable est
      # absente. Sans elle, Compose passerait une chaine vide et Garage
      # demarrerait sans jeton d'administration — une API d'admin ouverte, pour
      # un oubli de .env.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?absent de deploy/.env — lancez ./scripts/garage-secrets.sh --si-absent}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?absent de deploy/.env — lancez ./scripts/garage-secrets.sh --si-absent}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?absent de deploy/.env — lancez ./scripts/garage-secrets.sh --si-absent}
      # Sans cela, Garage n'ecrit que les erreurs et le diagnostic est aveugle.
      RUST_LOG: garage=info
    ports:
      # 3900 : API S3. 3903 : API d'administration, utilisee par init.sh.
      # La console web n'existe pas — Garage n'en a pas, contrairement a MinIO.
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      # « /garage status » et non curl : l'image ne contient ni curl ni wget.
      # Il repond des que le noeud ecoute, meme sans disposition appliquee —
      # « healthy » ne veut donc pas dire « pret a ecrire ».
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Distances et durées. Le fichier .osm.pbf du Bénin doit être placé dans
  # deploy/.data/osrm/ avant le premier démarrage (voir deploy/README.md).
  osrm:
    networks: [hba-internal]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/benin-latest.osrm"]
    ports:
      - "5000:5000"
    volumes:
      - ./.data/osrm:/data
    profiles: ["routing"]

  otel-collector:
    networks: [hba-internal]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    networks: [hba-internal]
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    networks: [hba-internal]
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  tempo:
    networks: [hba-internal]
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

  grafana:
    networks: [hba-internal]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: hba
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  kafkadata:
  garagemeta:
  garagedata:

# UN SEUL RESEAU POUR TOUS LES CONTENEURS. Il est cree hors compose
# (« make net »), donc les deux piles — developpement et conteneurs — s'y
# rattachent au lieu d'en creer chacune un. C'est ce qui permet a un service
# conteneurise de resoudre « postgres » et « kafka » quelle que soit la pile
# d'infrastructure demarree.
networks:
  hba-internal:
    external: true
    name: hba-internal
